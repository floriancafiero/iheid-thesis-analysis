name: Wikidata - identifier les personnes NER

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Décalage de la première ligne (0, 100, 200...)"
        required: true
        type: number
        default: 0
      batch_size:
        description: "Nombre de formes traitées dans ce lot (100 conseillé)"
        required: true
        type: number
        default: 100
      delay:
        description: "Pause entre les requêtes Wikidata (secondes)"
        required: true
        type: string
        default: "0.7"

permissions:
  contents: read

jobs:
  wikidata:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Résoudre les QID candidats, sans attribuer de sujets
        run: |
          mkdir -p results/wikidata
          python -u analysis/wikidata_batch_linker.py \
            analysis/all_person_candidates.csv \
            --start "${{ inputs.start }}" \
            --batch-size "${{ inputs.batch_size }}" \
            --delay "${{ inputs.delay }}" \
            --out results/wikidata/candidate_qids.csv
      - name: Filtrer les professions académiques et attribuer les pays
        run: |
          python -u analysis/filter_wikidata_people.py \
            results/wikidata/candidate_qids.csv \
            --delay "${{ inputs.delay }}" \
            --out results/wikidata/person_country_links.csv
      - name: Vérifier la sortie
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          with open('results/wikidata/candidate_qids.csv',encoding='utf8',newline='') as f:
              rows=list(csv.DictReader(f))
          counts=Counter(x['status'] for x in rows)
          print("Résultats des candidats :",dict(counts))
          if not rows or counts['network_error']==len(rows):
              raise SystemExit("API Wikidata indisponible.")
          print("Aucune personne n'est automatiquement considérée comme le sujet d'une thèse.")
          PY
      - name: Télécharger les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-personnes-${{ inputs.start }}-${{ inputs.batch_size }}
          path: results/wikidata/
          if-no-files-found: warn
          retention-days: 30
